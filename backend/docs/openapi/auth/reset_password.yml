tags:
  - Auth
summary: Reset password with recovery token
consumes:
  - application/json
security: []
parameters:
  - in: body
    name: body
    description: Request body
    required: true
    schema:
      type: object
      required:
        - access_token
        - new_password
      properties:
        access_token:
          type: string
          description: Recovery access token
        new_password:
          type: string
responses:
  200:
    description: Success
  400:
    description: Bad request
  500:
    description: Server error
