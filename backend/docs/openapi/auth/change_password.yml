tags:
  - Auth
summary: Change password
consumes:
  - application/json
security:
  - Bearer: []
parameters:
  - in: body
    name: body
    description: Request body
    required: true
    schema:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
responses:
  200:
    description: Success
  400:
    description: Bad request
  401:
    description: Unauthorized
  500:
    description: Server error
