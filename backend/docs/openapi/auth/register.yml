tags:
  - Auth
summary: Register a new user
consumes:
  - application/json
security: []
parameters:
  - in: body
    name: body
    description: Request body
    required: true
    schema:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      properties:
        email:
          type: string
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        signup_type:
          type: string
          description: individual or organization
responses:
  201:
    description: Created
  400:
    description: Bad request
  500:
    description: Server error
