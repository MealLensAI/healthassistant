tags:
  - Meal Plans
summary: Get specific meal from plan
security:
  - Bearer: []
parameters:
  - in: path
    name: plan_id
    type: string
    required: true
    description: Meal plan id
  - in: path
    name: day
    type: string
    required: true
    description: Day key
  - in: path
    name: meal_type
    type: string
    required: true
    description: breakfast|lunch|dinner|snack
responses:
  200:
    description: Success
  400:
    description: Bad request
  401:
    description: Unauthorized
  500:
    description: Server error
