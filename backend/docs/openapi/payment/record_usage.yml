tags:
  - Payment
summary: Record feature usage
consumes:
  - application/json
security:
  - Bearer: []
parameters:
  - in: path
    name: feature_name
    type: string
    required: true
    description: Feature name
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        count:
          type: integer
responses:
  200:
    description: Success
  400:
    description: Bad request
  401:
    description: Unauthorized
  500:
    description: Server error
