tags:
  - Enterprise
summary: Update enterprise
consumes:
  - application/json
security:
  - Bearer: []
parameters:
  - in: path
    name: enterprise_id
    type: string
    required: true
    description: Enterprise id
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        organization_type:
          type: string
        max_users:
          type: integer
        settings:
          type: object
        is_active:
          type: boolean
responses:
  200:
    description: Success
  400:
    description: Bad request
  401:
    description: Unauthorized
  500:
    description: Server error
