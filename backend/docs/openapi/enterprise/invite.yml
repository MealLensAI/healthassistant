tags:
  - Enterprise
summary: Invite user to enterprise
consumes:
  - application/json
security:
  - Bearer: []
parameters:
  - in: path
    name: enterprise_id
    type: string
    required: true
    description: Enterprise id
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - email
      properties:
        email:
          type: string
        role:
          type: string
          description: client|patient|doctor|nutritionist
        message:
          type: string
responses:
  201:
    description: Created
  400:
    description: Bad request
  401:
    description: Unauthorized
  500:
    description: Server error
